spring.application.name=data

#Esta linea conecta el programa a la base de datos.
#spring.datasource.url=jdbc:h2:./db/database

#Esta linea hace lo mismo que arriba pero cierra la base de datos al salir.
spring.datasource.url=jdbc:h2:./db/database;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true

spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor